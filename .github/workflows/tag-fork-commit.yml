name: Tag validated fork commit

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to tag
        required: false
        type: string
      dry_run:
        description: Only print the next tag
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  tag:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Tag fork commit
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            scripts/tag-fork-commit.sh --dry-run
          else
            scripts/tag-fork-commit.sh
            git push origin --tags
          fi
